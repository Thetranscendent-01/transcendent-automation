name: Daily Transcendent Promotion

on:
  schedule:
    # Runs automatically every 6 hours while you sleep
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Automated Promotion & Feed Monitor
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
        run: python3 promote.py

      - name: Commit updated state, daily pack, and SEO syndication site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json daily_pack.md index.html feed.xml sitemap.xml
          git diff --staged --quiet || git commit -m "chore: automated 6-hourly SEO syndication & daily promotion update"
          git push
